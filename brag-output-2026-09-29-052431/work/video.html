<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#f5f1e9}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="data.js"></script>
<script src="timeline.js"></script>
<script>
const W = 1920, H = 1080;
const C = {
  ink: '#17202a', muted: '#687482', paper: '#f5f1e9', card: '#fffdf9', line: '#ddd7cc',
  codex: '#157a6e', claude: '#bf6c43', purple: '#d73a4a', opened: '#bc4c00', closed: '#8250df', event: '#c24369', axis: '#89918e',
  boom: '#c24369', bust: '#1f8f4d', shrug: '#687482', nolink: '#5a4a8a'
};
const KIND = {
  boom: { col: C.boom, arrow: '↑', word: 'BOOM', rule: 'backlog grew ≥ 10%', short: '≥ 10% growth' },
  bust: { col: C.bust, arrow: '↓', word: 'BUST', rule: 'backlog shrank ≥ 5%', short: '≥ 5% drop' },
  shrug: { col: C.shrug, arrow: '~', word: 'SHRUG', rule: 'moved less than that', short: 'less than either' },
  nolink: { col: C.nolink, arrow: '?', word: 'NO RELEASE', rule: 'big swing, no launch within 14 days', short: 'no launch nearby' }
};
const SERIF = 'Georgia, "Times New Roman", serif';
const SANS = '-apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif';
const ctx = document.getElementById('c').getContext('2d');
{ const arc = CanvasRenderingContext2D.prototype.arc; CanvasRenderingContext2D.prototype.arc = function (x, y, r, ...rest) { return arc.call(this, x, y, Math.max(0, r), ...rest); }; }
const { REPOS, scenes } = TL;
REPOS.codex.color = C.codex; REPOS.claude.color = C.claude;
REPOS.codex.label = 'OPENAI / CODEX'; REPOS.claude.label = 'ANTHROPICS / CLAUDE-CODE';

// GitHub octicons (16×16): issue-opened / issue-closed
const ICON_OPEN = new Path2D('M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z');
const ICON_CLOSED = new Path2D('M11.28 6.78a.75.75 0 0 0-1.06-1.06L7.25 8.69 5.78 7.22a.75.75 0 0 0-1.06 1.06l2 2a.75.75 0 0 0 1.06 0l3.5-3.5Z M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0Zm-1.5 0a6.5 6.5 0 1 0-13 0 6.5 6.5 0 0 0 13 0Z');
function icon(path, x, y, size, color, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(size / 16, size / 16);
  ctx.fillStyle = color; ctx.fill(path, 'evenodd'); ctx.restore();
}
// lab logos (Simple Icons, 24×24), tinted to each repo's colour
const LOGOS = {};
const logosReady = Promise.all([['codex', 'logos/openai.svg'], ['claude', 'logos/claude.svg']].map(([k, src]) => fetch(src).then(r => r.text()).then(svg => {
  LOGOS[k] = new Path2D([...svg.matchAll(/ d="([^"]+)"/g)].map(m => m[1]).join(' '));
})));
function logo(k, x, y, size, color, alpha = 1) {
  if (!LOGOS[k]) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(size / 24, size / 24);
  ctx.fillStyle = color; ctx.fill(LOGOS[k]); ctx.restore();
}

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const fmt = n => Math.round(n).toLocaleString('en-US');
const signed = n => (Math.round(n) > 0 ? '+' : Math.round(n) < 0 ? '−' : '±') + fmt(Math.abs(n));
const pctS = p => (p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(p * 100).toFixed(Math.abs(p) < .1 ? 1 : 0) + '%';
const dt = (s, o = { month: 'short', day: 'numeric', year: 'numeric' }) => new Date(s + 'T00:00:00Z').toLocaleDateString('en-US', { ...o, timeZone: 'UTC' });
function dateRange(a, b) {
  if (a === b) return dt(a);
  const [ya, ma] = a.split('-'), [yb, mb] = b.split('-');
  if (ya === yb && ma === mb) return `${dt(a, { month: 'short', day: 'numeric' })} – ${+b.slice(8)}, ${ya}`;
  return `${dt(a, { month: 'short', day: 'numeric' })} – ${dt(b)}`;
}
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(str, x, y, font, color, align = 'left', alpha = 1, ls = 0) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align;
  if (ls) ctx.letterSpacing = ls + 'px'; ctx.fillText(str, x, y); ctx.restore();
}
const caps = (str, x, y, size, color, align = 'left', alpha = 1, sp = .16, w = 800) => text(str, x, y, `${w} ${size}px ${SANS}`, color, align, alpha, size * sp);
function wrap(str, maxW, font) {
  ctx.save(); ctx.font = font; const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
  if (cur) lines.push(cur); ctx.restore(); return lines;
}
function para(str, x, y, maxW, font, color, lh, alpha = 1, align = 'left') {
  wrap(str, maxW, font).forEach((l, i) => text(l, x, y + i * lh, font, color, align, alpha));
}
function reveal(t, t0, dur = .45, dist = 36) { const p = easeOut(prog(t, t0, t0 + dur)); return [p, (1 - p) * dist]; }
// fade out during the last `d` seconds of a scene
const outA = (t, sc, d = .35) => 1 - easeIn(prog(t, sc.end - d, sc.end));

// ---------- hook ----------
const DOTS = (() => {
  const R = rng(42), out = [];
  for (let y = 0; y < 54; y++) for (let x = 0; x < 96; x++) out.push({ x: 10 + x * 20, y: 10 + y * 20, r: R(), v: R() });
  return out.sort((a, b) => a.r - b.r);
})();
function drawHook(t, sc) {
  const oa = outA(t, sc, .4);
  const p = easeOut(prog(t, .1, 1.4)), nShow = Math.floor(DOTS.length * p), fall = prog(t, sc.end - .45, sc.end);
  for (let k = 0; k < nShow; k++) {
    const d = DOTS[k], age = clamp((t - .1 - (k / DOTS.length) * 1.3) * 5);
    ctx.globalAlpha = 1 - fall;
    ctx.fillStyle = k % 9 === 0 ? 'rgba(194,67,105,.55)' : k % 5 === 0 ? 'rgba(191,108,67,.4)' : 'rgba(215,58,74,.28)';
    ctx.beginPath(); ctx.arc(d.x, d.y + fall * fall * (600 + d.v * 900), 5.2 * Math.min(1, age), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 860);
  g.addColorStop(0, 'rgba(245,241,233,.97)'); g.addColorStop(.55, 'rgba(245,241,233,.88)'); g.addColorStop(1, 'rgba(245,241,233,0)');
  ctx.save(); ctx.globalAlpha = oa; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();

  const [ea, edy] = reveal(t, .15, .4, 20);
  caps('● LIVE GITHUB SNAPSHOT · ' + dt(DATA.generatedAt.slice(0, 10)).toUpperCase(), W / 2, 250 + edy, 24, C.event, 'center', ea * oa, .2);
  const val = REPOS.codex.open * easeOut(prog(t, .1, 1.4));
  const hit = t >= 1.4 ? 1 + .07 * Math.exp(-(t - 1.4) * 8) * Math.cos((t - 1.4) * 30) : lerp(.9, 1, prog(t, .1, 1.4));
  ctx.save(); ctx.globalAlpha = oa; ctx.translate(W / 2, 520); ctx.scale(hit, hit);
  ctx.font = `700 280px ${SERIF}`; ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.letterSpacing = '-12px';
  ctx.fillText(fmt(val), 0, 0); ctx.restore();
  const [la, ldy] = reveal(t, 1.35, .4, 30);
  ctx.save(); ctx.globalAlpha = la * oa;
  ctx.font = `500 50px ${SANS}`; const w1 = ctx.measureText('open issues on ').width;
  ctx.font = `800 50px ${SANS}`; const w2 = ctx.measureText('openai/codex').width;
  const hx = W / 2 - (w1 + w2) / 2;
  ctx.font = `500 50px ${SANS}`; ctx.fillStyle = C.ink; ctx.fillText('open issues on ', hx, 625 + ldy);
  ctx.font = `800 50px ${SANS}`; ctx.fillStyle = C.codex; ctx.fillText('openai/codex', hx + w1, 625 + ldy); ctx.restore();
  const [ca, cdy] = reveal(t, 2.3, .45, 30);
  const cv = REPOS.claude.open * easeOut(prog(t, 2.3, 3.1));
  ctx.save(); ctx.globalAlpha = ca * oa; ctx.textAlign = 'center';
  ctx.font = `700 64px ${SERIF}`; ctx.fillStyle = C.muted; ctx.fillText(`+ ${fmt(cv)}`, W / 2 - 250, 755 + cdy);
  ctx.font = `500 40px ${SANS}`; ctx.fillStyle = C.muted; ctx.textAlign = 'left'; ctx.fillText('on', W / 2 - 110, 752 + cdy);
  ctx.font = `800 40px ${SANS}`; ctx.fillStyle = C.claude; ctx.fillText('anthropics/claude-code', W / 2 - 50, 752 + cdy);
  ctx.restore();
}

// ---------- intro ----------
function drawIntro(t, sc) {
  const s = sc.start, oa = outA(t, sc);
  // beat A
  const aOut = 1 - easeIn(prog(t, s + 3.2, s + 3.5));
  if (aOut > 0) {
    const [ea, edy] = reveal(t, s + .05, .4, 20);
    caps('ISSUE WITH AI', W / 2, 330 + edy, 26, C.muted, 'center', ea * aOut, .24);
    const [a1, d1] = reveal(t, s + .15, .5, 50);
    text(`${TL.releaseCount} model & product releases.`, W / 2, 510 + d1, `700 118px ${SERIF}`, C.ink, 'center', a1 * aOut, -3);
    const [a2, d2] = reveal(t, s + .8, .5, 50);
    text('Did any of them move the backlog?', W / 2, 660 + d2, `italic 400 84px ${SERIF}`, C.muted, 'center', a2 * aOut);
  }
  // beat B
  const b0 = s + 3.5;
  if (t >= b0) {
    const [ea, edy] = reveal(t, b0, .4, 20);
    caps('HOW TO READ THIS', 150, 230 + edy, 24, C.event, 'left', ea * oa, .2);
    const [a1, d1] = reveal(t, b0 + .1, .5, 40);
    text('For each release, we measure the change', 150, 330 + d1, `700 76px ${SERIF}`, C.ink, 'left', a1 * oa, -1.5);
    text('in open issues over the next 14 days.', 150, 420 + d1, `700 76px ${SERIF}`, C.ink, 'left', a1 * oa, -1.5);
    ['boom', 'bust', 'shrug', 'nolink'].forEach((k, i) => {
      const K = KIND[k], x = 150 + (i % 2) * 820, y = 540 + Math.floor(i / 2) * 170;
      const [pa, pdy] = reveal(t, b0 + .7 + i * .25, .45, 30);
      ctx.save(); ctx.globalAlpha = pa * oa; ctx.translate(0, pdy);
      rrect(x, y, 780, 140, 22); ctx.fillStyle = C.card; ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.stroke();
      text(`${K.arrow} ${K.word}`, x + 40, y + 70, `700 50px ${SERIF}`, K.col);
      text(K.rule, x + 42, y + 112, `500 26px ${SANS}`, C.muted);
      ctx.restore();
    });
  }
}

// ---------- chapter cards ----------
function drawChapter(t, sc) {
  const r = REPOS[sc.repo], s = sc.start, oa = outA(t, sc, .3);
  const n = sc.repo === 'codex' ? 1 : 2;
  const [ea, edy] = reveal(t, s + .2, .4, 20);
  caps(`CHAPTER ${n} · ${r.slug.toUpperCase()}`, W / 2, 300 + edy, 26, r.color, 'center', ea * oa, .22);
  const [a, d] = reveal(t, s + .3, .5, 50);
  text(r.name, W / 2, 450 + d, `700 140px ${SERIF}`, C.ink, 'center', a * oa, -5);
  const stats = [['ISSUES FILED', r.opened, C.ink], ['CLOSED', r.closed, C.closed], ['STILL OPEN', r.open, C.purple]];
  stats.forEach(([lbl, v, col], i) => {
    const x = W / 2 + (i - 1) * 440, [sa, sdy] = reveal(t, s + .7 + i * .18, .45, 30);
    text(fmt(v * easeOut(prog(t, s + .7 + i * .18, s + 1.6 + i * .18))), x, 640 + sdy, `700 104px ${SERIF}`, col, 'center', sa * oa, -3);
    caps(lbl, x, 692 + sdy, 22, C.muted, 'center', sa * oa);
  });
  const [fa] = reveal(t, s + 1.2, .5, 0);
  const extra = sc.repo === 'claude' ? ` · backlog peaked at ${fmt(r.peak.unclosed)} on ${dt(r.peak.date)}` : '';
  text(`Since ${dt(r.days[0].date)}${extra}`, W / 2, 790, `italic 400 36px ${SERIF}`, C.muted, 'center', fa * oa);
}

// ---------- chart chapters ----------
const CH = { x0: 140, x1: 1210, top: 320, base: 630 };
const FLOW = { mid: 728, h: 70 };        // daily opened (up) / closed (down) strip
const FLAG_Y = 292, BANNER_Y = 222;      // release flags + current-release banner
const rateS = v => v == null ? 'n/a' : (v < 10 ? v.toFixed(1) : fmt(v));
function cursorAt(sc, t) {
  const r = REPOS[sc.repo], st = sc.stops, n = r.days.length;
  let prev = 0;
  for (const s of st) {
    if (t < s.tTravel) return prev;
    if (t < s.tArrive) return lerp(prev, s.i0, easeInOut(prog(t, s.tTravel, s.tArrive)));
    if (t < s.tLeave) return lerp(s.i0, s.reach, easeOut(prog(t, s.tArrive, s.tLeave - .05)));
    prev = s.reach;
  }
  const last = st.at(-1);
  return lerp(last.reach, n - 1, easeInOut(prog(t, last.tLeave, sc.tRunEnd)));
}
function currentStop(sc, t) { let cur = null; for (const s of sc.stops) if (t >= s.tArrive - .15) cur = s; return cur; }

function drawChart(t, sc) {
  const r = REPOS[sc.repo], days = r.days, n = days.length, s0 = sc.start;
  const oa = outA(t, sc, .3);
  const cur = cursorAt(sc, t), ci = Math.floor(cur);
  const X = i => lerp(CH.x0, CH.x1, i / (n - 1));
  let vmax = 0; for (let i = 0; i <= Math.min(n - 1, Math.ceil(cur)); i++) vmax = Math.max(vmax, days[i].unclosed);
  vmax = Math.max(300, vmax * 1.18);
  const Y = v => CH.base - (CH.base - CH.top) * v / vmax;
  const curVal = lerp(days[ci].unclosed, days[Math.min(n - 1, ci + 1)].unclosed, cur - ci);
  const stop = currentStop(sc, t);

  // shake + flash for big moves
  let sx = 0, sy = 0, flash = 0, flashCol = C.boom;
  for (const s of sc.stops) if (s.big && t >= s.tArrive) {
    const e = t - s.tArrive, amp = 16 * Math.exp(-e * 6);
    sx += Math.sin(e * 70) * amp; sy += Math.cos(e * 53) * amp * .7;
    const f = .14 * Math.exp(-e * 7); if (f > flash) { flash = f; flashCol = KIND[s.kind].col; }
  }
  ctx.save(); ctx.globalAlpha = oa; ctx.translate(sx, sy);

  const [ha, hdy] = reveal(t, s0, .45, 30);
  logo(sc.repo, CH.x0, 104 + hdy, 32, r.color, ha);
  caps(r.label, CH.x0 + 44, 130 + hdy, 22, r.color, 'left', ha);
  text('Open issues vs. model releases', CH.x0, 196 + hdy, `700 56px ${SERIF}`, C.ink, 'left', ha, -1);
  // tally pills
  const tally = { boom: 0, bust: 0, shrug: 0, nolink: 0 };
  for (const s of sc.stops) if (t >= s.tArrive) tally[s.kind]++;
  let tx = 1800;
  ['nolink', 'shrug', 'bust', 'boom'].forEach(k => {
    const K = KIND[k], label = `${K.arrow} ${K.word}  ${tally[k]}`;
    ctx.save(); ctx.font = `800 20px ${SANS}`; ctx.letterSpacing = '1px'; const w = ctx.measureText(label).width + 36; ctx.restore();
    tx -= w; const bump = sc.stops.filter(s => s.kind === k && t >= s.tArrive).reduce((m, s) => Math.max(m, Math.exp(-(t - s.tArrive) * 8)), 0);
    ctx.save(); ctx.globalAlpha *= ha; ctx.translate(tx + w / 2, 128 + hdy); ctx.scale(1 + .18 * bump, 1 + .18 * bump);
    rrect(-w / 2, -24, w, 48, 24); ctx.fillStyle = tally[k] ? K.col : C.card; ctx.fill(); ctx.strokeStyle = K.col; ctx.lineWidth = 2; ctx.stroke();
    text(label, 0, 7, `800 20px ${SANS}`, tally[k] ? '#fff' : K.col, 'center', 1, 1);
    ctx.restore(); tx -= 12;
  });

  const [ga, gdy] = reveal(t, s0 + .15, .5, 20);
  ctx.save(); ctx.globalAlpha *= ga; ctx.translate(0, gdy);
  // grid
  const step = niceStep(vmax / 4);
  ctx.font = `500 18px ${SANS}`; ctx.fillStyle = C.axis; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let v = 0; v <= vmax; v += step) {
    const y = Y(v); ctx.strokeStyle = v === 0 ? '#c9c1b3' : 'rgba(137,145,142,.18)'; ctx.lineWidth = v === 0 ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(CH.x0, y); ctx.lineTo(CH.x1, y); ctx.stroke();
    ctx.fillText(v >= 1000 ? (v / 1000) + 'k' : v, CH.x0 - 14, y);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const FB = FLOW.mid + FLOW.h;
  days.forEach((d, i) => {
    if (d.date.endsWith('-01') && ['01', '04', '07', '10'].includes(d.date.slice(5, 7))) {
      ctx.fillText(dt(d.date, { month: 'short', year: '2-digit' }).replace(' ', " '"), X(i), FB + 26);
      ctx.fillRect(X(i) - .5, FB + 12, 1, 8);
    }
  });
  ctx.restore();

  // 14-day windows (backlog chart + flow strip)
  for (const s of sc.stops) {
    if (t < s.tArrive) continue;
    const col = KIND[s.kind].col, isCur = s === stop;
    const shown = isCur ? clamp((cur - s.i0) / Math.max(1, s.i1 - s.i0)) : 1;
    const wx = X(s.i0), ww = (X(s.i1) - X(s.i0)) * Math.max(shown, .08);
    ctx.save(); ctx.globalAlpha = (isCur ? .16 : .06) * ga; ctx.fillStyle = col;
    ctx.fillRect(wx, CH.top - 10, ww, FB - CH.top + 10); ctx.restore();
    if (s.kind === 'nolink') {
      ctx.save(); ctx.globalAlpha = .6 * ga; ctx.strokeStyle = col; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
      ctx.strokeRect(wx, CH.top - 10, ww, FB - CH.top + 10); ctx.restore();
    }
  }
  // flow strip: opened per day up, closed per day down (scale follows what's visible)
  {
    const vis = []; for (let i = 0; i <= Math.min(n - 1, ci); i++) vis.push(Math.max(days[i].opened, days[i].closed));
    vis.sort((a, b) => a - b);
    const fmax = Math.max(5, vis[Math.floor((vis.length - 1) * .98)] || 5), bw = Math.max(1.2, (CH.x1 - CH.x0) / n * .7);
    ctx.save(); ctx.globalAlpha *= ga;
    ctx.fillStyle = '#c9c1b3'; ctx.fillRect(CH.x0, FLOW.mid - .5, CH.x1 - CH.x0, 1);
    for (const [lbl, y, col, path] of [['OPENED / DAY', FLOW.mid - 22, C.opened, ICON_OPEN], ['CLOSED / DAY', FLOW.mid + 32, C.closed, ICON_CLOSED]]) {
      caps(lbl, CH.x0 - 14, y, 12, col, 'right', 1, .1);
      ctx.save(); ctx.font = `800 12px ${SANS}`; ctx.letterSpacing = '1.2px'; const w = ctx.measureText(lbl).width; ctx.restore();
      icon(path, CH.x0 - 14 - w - 22, y - 13, 16, col);
    }
    for (let i = 0; i <= Math.min(n - 1, ci); i++) {
      const o = Math.min(1, days[i].opened / fmax) * FLOW.h, c = Math.min(1, days[i].closed / fmax) * FLOW.h;
      ctx.fillStyle = 'rgba(188,76,0,.55)'; ctx.fillRect(X(i) - bw / 2, FLOW.mid - o, bw, o);
      ctx.fillStyle = 'rgba(130,80,223,.65)'; ctx.fillRect(X(i) - bw / 2, FLOW.mid, bw, c);
    }
    ctx.restore();
  }
  // week-before window on the flow strip for the current release
  // (its label is drawn last, further down, so release lines never cross it)
  let drawWeekBadge = () => {};
  if (stop && stop.kind !== 'nolink' && stop.i0 >= 7) {
    const p = easeOut(prog(t, stop.tArrive - .1, stop.tArrive + .4));
    const a0 = X(stop.i0 - 7), a1 = X(stop.i0);
    ctx.save(); ctx.globalAlpha *= ga * p;
    ctx.fillStyle = 'rgba(31,143,77,.16)'; ctx.fillRect(a0, FLOW.mid - FLOW.h - 4, a1 - a0, FLOW.h * 2 + 8);
    ctx.strokeStyle = C.bust; ctx.lineWidth = 2; ctx.strokeRect(a0, FLOW.mid - FLOW.h - 4, a1 - a0, FLOW.h * 2 + 8);
    ctx.restore();
    drawWeekBadge = () => {
    ctx.save(); ctx.globalAlpha *= ga * p;
    const spike = stop.preX >= 1.5;
    const lbl = stop.preX == null ? 'WEEK BEFORE' : `WEEK BEFORE: CLOSING ${stop.preX.toFixed(1)}× NORMAL`;
    ctx.font = `800 14px ${SANS}`; ctx.letterSpacing = '1.5px'; const lw = ctx.measureText(lbl).width + 20;
    const lx = Math.max(CH.x0, a0 - lw - 6), ly = FLOW.mid + FLOW.h - 26;
    rrect(lx, ly, lw, 26, 13); ctx.fillStyle = spike ? C.bust : C.card; ctx.fill(); ctx.strokeStyle = C.bust; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = spike ? '#fff' : C.bust; ctx.fillText(lbl, lx + 10, ly + 18);
    ctx.restore();
    };
  }
  // release beams: every release date is a solid lab-colored line through both charts
  for (const date of r.releaseDates) {

const PANEL = { x: 1280, y: 232, w: 520, h: 766 };

  const K = KIND[s.kind], col = K.col;

  const next = sc.stops[sc.stops.indexOf(s) + 1];
  const inP = easeOut(prog(t, s.tArrive - .15, s.tArrive + .25));
  const outP = next ? easeIn(prog(t, next.tArrive - .35, next.tArrive - .15)) : 0;

// ---------- takeaways ----------
function drawTakeaways(t, sc) {
  const s = sc.start, oa = outA(t, sc);

  const nl = cl.stops.filter(x => x.kind === 'nolink');

  const items = [
    ['On average, a release week looks like any other.', `After ${rc.n} of ${rc.of} Codex releases (${pc(rc.n / rc.of)}), the backlog grew by 10% or more, which happened in ${pc(cx.base.boom)} of all 14-day stretches anyway. For Claude Code it was ${pc(rl.n / rl.of)} vs. ${pc(cl.base.boom)}.`],

// ---------- pre-release closing study ----------
function drawPrerelease(t, sc) {
  const s = sc.start, oa = outA(t, sc);
  const [ha, hdy] = reveal(t, s + .05, .45, 30);
  caps('ISSUES CLOSED PER DAY AROUND EACH RELEASE · 1.0× = NORMAL', 150, 130 + hdy, 22, C.muted, 'left', ha * oa);
  text('Do labs clean up before a launch?', 150, 204 + hdy, `700 64px ${SERIF}`, C.ink, 'left', ha * oa, -1.5);
  // plot
  const P = { x0: 230, x1: 1150, y0: 300, y1: 880, lo: .4, hi: 2.0 };
  const PX = off => lerp(P.x0, P.x1, (off + 21) / 42), PY = v => lerp(P.y1, P.y0, (clamp(v, P.lo, P.hi) - P.lo) / (P.hi - P.lo));
  const [ga, gdy] = reveal(t, s + .3, .5, 20);
  ctx.save(); ctx.globalAlpha = ga * oa; ctx.translate(0, gdy);
  ctx.fillStyle = 'rgba(31,143,77,.12)'; ctx.fillRect(PX(-7), P.y0, PX(0) - PX(-7), P.y1 - P.y0);
  caps('WEEK BEFORE', (PX(-7) + PX(0)) / 2, P.y0 + 24, 15, C.bust, 'center', 1, .12);
  for (const v of [.5, 1, 1.5, 2]) {
    ctx.strokeStyle = v === 1 ? '#a9a194' : 'rgba(137,145,142,.2)'; ctx.lineWidth = v === 1 ? 2 : 1; if (v === 1) ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.moveTo(P.x0, PY(v)); ctx.lineTo(P.x1, PY(v)); ctx.stroke(); ctx.setLineDash([]);
    text(v.toFixed(1) + '×', P.x0 - 14, PY(v) + 6, `500 18px ${SANS}`, C.axis, 'right');
  }
  text('normal', P.x0 - 14, PY(1) + 28, `italic 400 18px ${SERIF}`, C.muted, 'right');
  ctx.strokeStyle = C.event; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(PX(0), P.y0 - 10); ctx.lineTo(PX(0), P.y1); ctx.stroke();
  caps('RELEASE DAY', PX(0) + 10, P.y0 + 4, 15, C.event, 'left', 1, .12);
  for (const off of [-21, -14, -7, 0, 7, 14, 21]) text(off === 0 ? '0' : (off > 0 ? '+' : '−') + Math.abs(off) + 'd', PX(off), P.y1 + 34, `500 18px ${SANS}`, C.axis, 'center');
  ctx.restore();
  ['codex', 'claude'].forEach((k, j) => {
    const r = REPOS[k], pr = r.study.profile, p = easeInOut(prog(t, s + .7 + j * .5, s + 3.2 + j * .5));
    const upto = -21 + 42 * p;
    ctx.save(); ctx.globalAlpha = oa; ctx.strokeStyle = r.color; ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.beginPath(); pr.forEach((q, i) => { if (q.off > upto) return; i ? ctx.lineTo(PX(q.off), PY(q.v)) : ctx.moveTo(PX(q.off), PY(q.v)); }); ctx.stroke();
    if (p > 0 && p < 1) { const q = pr[Math.min(pr.length - 1, Math.floor(upto + 21))]; ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(PX(q.off), PY(q.v), 8, 0, 7); ctx.fill(); }
    if (p >= 1) { const q = pr.at(-1); text(k === 'codex' ? 'Codex' : 'Claude Code', PX(21) + 10, PY(q.v) + 7 + (k === 'codex' ? 14 : -14), `800 20px ${SANS}`, r.color); }
    ctx.restore();
  });
  // right column: medians + exceptions
  const RX = 1290;
  const [ma, mdy] = reveal(t, s + 3.4, .5, 30);
  ctx.save(); ctx.globalAlpha = ma * oa; ctx.translate(0, mdy);
  caps('MEDIAN CLOSING RATE VS. NORMAL', RX, 318, 16, C.muted, 'left', 1, .12);
  text('week before', RX + 340, 356, `600 18px ${SANS}`, C.muted, 'right'); text('2 weeks after', RX + 490, 356, `600 18px ${SANS}`, C.muted, 'right');
  ['codex', 'claude'].forEach((k, j) => {
    const r = REPOS[k], y = 410 + j * 58;
    ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(RX + 8, y - 9, 8, 0, 7); ctx.fill();
    text(r.short, RX + 26, y, `700 24px ${SANS}`, C.ink);
    text(r.study.pre.toFixed(2) + '×', RX + 340, y + 2, `700 34px ${SERIF}`, C.ink, 'right');
    text(r.study.post.toFixed(2) + '×', RX + 490, y + 2, `700 34px ${SERIF}`, r.study.post >= 1.1 ? C.bust : C.ink, 'right');
  });
  ctx.restore();
  const [ea, edy] = reveal(t, s + 5.0, .5, 30);
  ctx.save(); ctx.globalAlpha = ea * oa; ctx.translate(0, edy);
  caps('EXCEPTIONS: ≥ 1.5× CLOSING THE WEEK BEFORE', RX, 560, 16, C.bust, 'left', 1, .12);
  sc.spikes.slice(0, 4).forEach((x, i) => {
    const r = REPOS[x.repo], y = 604 + i * 54;
    ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(RX + 8, y - 9, 8, 0, 7); ctx.fill();
    text(x.names.join(' + '), RX + 26, y, `700 23px ${SANS}`, C.ink);
    text(`${x.preX.toFixed(1)}×`, RX + 470, y + 2, `700 32px ${SERIF}`, C.bust, 'right');
    text(`${dt(x.date, { month: 'short', day: 'numeric', year: 'numeric' })} · ${rateS(x.preRate)}/day vs ${rateS(x.base)}`, RX + 26, y + 24, `500 16px ${SANS}`, C.muted);
  });
  ctx.restore();
  const [fa] = reveal(t, s + 6.2, .5, 0);
  para('Verdict: release weeks close issues at the usual pace; only a few launches had a pre-release burst. Who closed each issue (people or bots) isn’t in this snapshot.', RX, 810, 500, `italic 400 22px ${SERIF}`, C.ink, 30, fa * oa);
}

// ---------- outro ----------
function drawOutro(t, sc) {
  const s = sc.start;
  const [ea, edy] = reveal(t, s + .05, .4, 20);
  caps('OPEN SOURCE SIGNALS / ISSUE ACTIVITY', W / 2, 220 + edy, 24, C.event, 'center', ea, .24);
  const [a, dy] = reveal(t, s + .15, .55, 60);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 400 + dy); const sc2 = lerp(1.06, 1, easeOut(prog(t, s + .15, s + 1.4))); ctx.scale(sc2, sc2);
  ctx.font = `700 210px ${SERIF}`; ctx.letterSpacing = '-12px'; ctx.textAlign = 'center'; ctx.fillStyle = C.ink; ctx.fillText('Issue with AI', 0, 0); ctx.restore();
  const [la, ldy] = reveal(t, s + .5, .45, 30);
  text('Can capability keep up with complexity?', W / 2, 495 + ldy, `italic 400 50px ${SERIF}`, C.muted, 'center', la);
  [['codex', 'openai/codex'], ['claude', 'anthropics/claude-code']].forEach(([k, slug], i) => {
    const r = REPOS[k], [pa, pdy] = reveal(t, s + .8 + i * .15, .45, 30);
    const label = `${slug}  ·  ${fmt(r.open)} open`;
    ctx.save(); ctx.globalAlpha = pa; ctx.font = `700 32px ${SANS}`; const w = ctx.measureText(label).width + 80;
    const x = i === 0 ? W / 2 - 20 - w : W / 2 + 20, y = 560 + pdy;
    rrect(x, y, w, 76, 38); ctx.fillStyle = C.card; ctx.fill(); ctx.strokeStyle = r.color; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(x + 38, y + 38, 9, 0, 7); ctx.fill();
    ctx.fillStyle = C.ink; ctx.textBaseline = 'middle'; ctx.fillText(label, x + 60, y + 40); ctx.restore();
  });
  // where to explore it: the site, big and dark so it reads at a glance
  const [ua, udy] = reveal(t, s + 1.1, .5, 30);
  const url = 'movy.github.io/issue-with-ai';
  ctx.save(); ctx.globalAlpha = ua; ctx.font = `800 40px ${SANS}`;
  const uw = ctx.measureText(url).width + 214, ux = W / 2 - uw / 2, uy = 690 + udy;
  rrect(ux, uy, uw, 88, 44); ctx.fillStyle = C.ink; ctx.fill();
  ctx.fillStyle = '#f39ab5'; ctx.font = `800 20px ${SANS}`; ctx.letterSpacing = '3px'; ctx.fillText('EXPLORE', ux + 40, uy + 53);
  ctx.letterSpacing = '0px'; ctx.font = `800 40px ${SANS}`; ctx.fillStyle = '#fffdf9'; ctx.fillText(url, ux + 170, uy + 58);
  ctx.restore();
  const [fa] = reveal(t, s + 1.5, .5, 0);
  text('Release dates line up with backlog moves. That’s correlation, not causation.', W / 2, 870, `500 26px ${SANS}`, C.muted, 'center', fa);
  text(`Data: GitHub GraphQL API snapshot, ${dt(DATA.generatedAt.slice(0, 10))} · releases via aireleasetracker.com and official announcements`, W / 2, 910, `500 21px ${SANS}`, C.axis, 'center', fa);
  text('Code: github.com/movy/issue-with-ai  ·  Film made with the brag skill: github.com/latent-spaces/brag', W / 2, 950, `600 21px ${SANS}`, C.muted, 'center', fa);
}

// ---------- chrome: wipes + progress ----------
function drawWipe(t, t0, color, label) {
  const a = prog(t, t0 - .32, t0), b = prog(t, t0, t0 + .32);
  if (a <= 0 || b >= 1) return;
  const lead = lerp(-350, W + 350, easeInOut(a)), trail = lerp(-350, W + 350, easeInOut(b));
  const path = () => { ctx.beginPath(); ctx.moveTo(trail + 150, 0); ctx.lineTo(lead + 150, 0); ctx.lineTo(lead - 150, H); ctx.lineTo(trail - 150, H); ctx.closePath(); };
  ctx.save(); path(); ctx.fillStyle = color; ctx.fill(); ctx.clip();
  ctx.font = `800 44px ${SANS}`; ctx.letterSpacing = '10px'; ctx.textAlign = 'center'; ctx.fillStyle = '#fffdf9';
  ctx.fillText(label, W / 2 + lerp(80, -80, prog(t, t0 - .32, t0 + .32)), H / 2 + 16); ctx.restore();
}
function drawProgress(t) {
  const a = prog(t, 4.5, 5.2) * (1 - prog(t, TL.total - 5.5, TL.total - 5));
  if (a <= 0) return;
  // spans the frame like the player's own scrubber, so chapters line up with it
  const x0 = 22, x1 = W - 22, y = 1030, X = v => lerp(x0, x1, v / TL.total);
  ctx.save(); ctx.globalAlpha = a;
  rrect(x0, y, x1 - x0, 5, 3); ctx.fillStyle = 'rgba(137,145,142,.25)'; ctx.fill();
  rrect(x0, y, X(t) - x0, 5, 3); ctx.fillStyle = C.event; ctx.fill();
  TL.chapters.forEach(([lbl, st], i) => {
    const nxt = TL.chapters[i + 1] ? TL.chapters[i + 1][1] : TL.total, active = t >= st && t < nxt;
    ctx.fillStyle = active ? C.event : '#b9b1a4'; ctx.fillRect(X(st) - 1, y - 6, 2, 17);
    caps(lbl.toUpperCase(), X(st) + 8, y - 10, 13, active ? C.event : C.axis, 'left', 1, .14);
  });
  ctx.restore();
}

// ---------- frame ----------
const DRAW = { hook: drawHook, intro: drawIntro, chapter: drawChapter, chart: drawChart, prerelease: drawPrerelease, throughput: drawThroughput, leaderboard: drawLeaderboard, takeaways: drawTakeaways, outro: drawOutro };
window.renderFrame = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  const vg = ctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1250);
  vg.addColorStop(0, 'rgba(255,253,249,.6)'); vg.addColorStop(1, 'rgba(221,215,204,.35)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  for (const sc of scenes) if (t >= sc.start && t < sc.end + (sc.type === 'hook' ? .05 : 0)) { ctx.save(); DRAW[sc.type](t, sc); ctx.restore(); }
  if (t >= scenes.at(-1).end) DRAW.outro(t, scenes.at(-1));
  drawProgress(t);
  for (const sc of scenes) {
    if (sc.type === 'chapter') drawWipe(t, sc.start, REPOS[sc.repo].color, REPOS[sc.repo].label);
    if (sc.type === 'prerelease') drawWipe(t, sc.start, C.bust, 'CLEANUP BEFORE LAUNCH?');
  }
};
window.ready = Promise.all([document.fonts.ready, logosReady]).then(() => true);
window.TOTAL = TL.total;
</script>
