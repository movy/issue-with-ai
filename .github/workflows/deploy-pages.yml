name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - styles.css
      - data/**
      - media/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate snapshot
        run: npm run check
      # Publish only what the page needs; film sources and renders stay out of the site.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css _site/
          cp -R data media _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
